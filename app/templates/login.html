<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · YT Uploader</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="login-page"><main class="login-card"><div class="brand login-brand"><span class="brand-mark">YT</span><div><strong>YT Uploader</strong><small>Administrator access</small></div></div><h1>Sign in</h1><p class="muted-text">Use the administrator credentials created during installation.</p>{% if error %}<div class="alert danger">{{ error }}</div>{% endif %}<form method="post" action="/login" class="login-form"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="button primary full">Sign in</button></form><p class="login-foot">Local self-hosted service · Access is protected</p></main></body></html>
